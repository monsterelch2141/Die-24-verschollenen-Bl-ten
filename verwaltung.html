<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luminara – Verwaltung</title><style>body{background:#f7edd9;color:#795334;font:18px Georgia;max-width:700px;margin:auto;padding:24px}input,button,select{font:inherit;padding:10px;margin:5px;max-width:95%}button{background:#795334;color:white;border:0;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}</style><h1>Spielstandverwaltung</h1><a href="./">Zurück zur Reise</a><form id="login"><input type="email" placeholder="E-Mail" required><input type="password" placeholder="Passwort" required><button>Anmelden</button></form><p id="status" role="status"></p><section id="panel" hidden><button id="reload">Aktualisieren</button><button id="export">Sicherung exportieren</button><pre id="summary"></pre><label>Frühere Version eines Spielstandbestandteils<select id="history"></select></label><button id="restore">Version wiederherstellen</button><p>Die Wiederherstellung verändert nur den ausgewählten Bestandteil. Fotos bleiben unverändert.</p></section><script>
const base='https://cabauhsfbmprcdvjzpry.supabase.co',key='sb_publishable_TLaNvdawn823Iwlz_miQ2g_N0Eep5py',uid='884ef975-7565-4266-8984-8267d0eb9e20';let token,rows=[],history=[];const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(base+path,{...opt,headers:{apikey:key,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',...opt.headers}});if(!r.ok)throw Error('Anfrage fehlgeschlagen: '+r.status);const t=await r.text();return t?JSON.parse(t):null}async function load(){rows=await api('/rest/v1/luminara_progress?user_id=eq.'+uid+'&select=*');history=await api('/rest/v1/luminara_history?user_id=eq.'+uid+'&select=*&order=id.desc&limit=500');$('summary').textContent=rows.map(r=>r.state_key+' · Version '+r.revision+' · '+new Date(r.updated_at).toLocaleString('de')).join('\n')||'Noch kein Spielstand';$('history').replaceChildren(...history.map((r,i)=>new Option(r.state_key+' · '+new Date(r.saved_at).toLocaleString('de')+' · v'+r.revision,i)));}async function run(fn){try{await fn();$('status').textContent='Erfolgreich.'}catch(e){$('status').textContent=e.message}}$('login').onsubmit=e=>{e.preventDefault();run(async()=>{const [email,pw]=$('login').querySelectorAll('input');const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:email.value,password:pw.value})});token=d.access_token;pw.value='';const m=await api('/rest/v1/luminara_members?select=role&user_id=eq.'+d.user.id);if(m[0]?.role!=='owner'){token=null;throw Error('Kein Verwaltungszugang');}await load();$('login').hidden=true;$('panel').hidden=false;})};$('reload').onclick=()=>run(load);$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({rows,history},null,2)],{type:'application/json'}));a.download='luminara-sicherung.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>run(async()=>{const h=history[Number($('history').value)];if(!h||!confirm('Diese frühere Version wiederherstellen? Der aktuelle Stand wird archiviert.'))return;const r=rows.find(x=>x.state_key===h.state_key);if(!r)throw Error('Aktueller Bestandteil fehlt');const result=await api('/rest/v1/luminara_progress?user_id=eq.'+uid+'&state_key=eq.'+encodeURIComponent(h.state_key)+'&revision=eq.'+r.revision,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({payload:h.payload,revision:r.revision+1,updated_at:new Date().toISOString()})});if(!result?.length)throw Error('Spielstand inzwischen geändert. Bitte aktualisieren.');await load()});
</script></html>
