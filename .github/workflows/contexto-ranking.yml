name: Build Contexto semantic ranking
on:
  workflow_dispatch:
  push:
    paths:
      - generate-contexto.py
      - .github/workflows/contexto-ranking.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install 'sentence-transformers>=3,<6' 'wordfreq>=3,<4' 'numpy<3'
      - run: python generate-contexto.py
      - name: Commit generated ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contexto-ranking.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate 35k precomputed semantic Contexto ranks"
            git push
          fi
